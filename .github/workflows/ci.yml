name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm install --no-audit --no-fund
      - run: scripts/test-all.sh
        env:
          FUZZ_SEEDS: "2000"
