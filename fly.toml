# Deploy (app names are global; change it if taken):
#   fly apps create collab-editor-adityapatil
#   fly volumes create collab_data --size 1 --region ewr --yes
#   fly deploy
app = "collab-editor-adityapatil"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "collab_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
